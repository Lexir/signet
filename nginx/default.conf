# Reverse proxy перед Signet. Всё внешнее (80/443) терминируется здесь,
# приложение слушает только внутри сети compose (app:8080).
#
# Этот файл — рабочий вариант по http. HTTPS проще всего включить через
# install.sh (спросит домен и сам выпустит сертификат). Ручной путь — внизу.
#
# Заголовки X-Forwarded-* обязательны: по ним приложение (профиль prod,
# TRUST_FORWARDED_HEADERS=true) видит реальный IP клиента для rate limit
# и защиты от перебора пароля.

server {
    listen 80;
    server_name _;

    # ACME http-01: certbot кладёт проверочный файл в общий webroot,
    # nginx отдаёт его. Должно работать ДО выпуска сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Вложения писем скачиваются через приложение — не режем их на прокси.
    client_max_body_size 25m;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;    # полный синк ящика может идти десятки секунд
    }
}

# --- HTTPS вручную (если не пользуетесь install.sh) ---
